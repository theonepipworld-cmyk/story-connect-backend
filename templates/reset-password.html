<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset</title>
  <style>
    /* Reset some default styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #fff;
      padding: 30px 40px;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #222;
    }

    p {
      font-size: 16px;
      color: #555;
      margin-bottom: 15px;
    }

    a.button {
      display: inline-block;
      padding: 14px 24px;
      margin: 20px 0;
      background-color: #4CAF50;
      color: #fff !important;
      text-decoration: none;
      font-weight: 600;
      border-radius: 6px;
      transition: background-color 0.3s ease;
    }

    a.button:hover {
      background-color: #45a049;
    }

    .footer {
      font-size: 13px;
      color: #999;
      margin-top: 30px;
      line-height: 1.4;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .container {
        padding: 25px 20px;
      }

      h1 {
        font-size: 22px;
      }

      p {
        font-size: 15px;
      }

      a.button {
        padding: 12px 20px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Password Reset Request</h1>
    <p>Hello</p>
    <p>You requested a password reset for your Story Connect account.
      Click the button below to reset your password:</p>

    <a href="{{resetLink}}" class="button">Reset Password</a>

    <p>This link will expire in <strong>15 minutes</strong>.</p>
    <p>If you didn’t request this, you can safely ignore this email.</p>

    <div class="footer">
      Regards,<br>Story Connect
    </div>
  </div>
</body>

</html>
