<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Password Reset</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      background: #ffffff;
      margin: 40px auto;
      padding: 30px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 22px;
      color: #333333;
    }
    p {
      font-size: 15px;
      color: #555555;
      line-height: 1.6;
    }
    a.button {
      display: inline-block;
      padding: 12px 20px;
      margin-top: 20px;
      background-color: #4CAF50;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
    a.button:hover {
      background-color: #45a049;
    }
    .footer {
      font-size: 12px;
      color: #999999;
      text-align: center;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Password Reset Request</h1>
    <p>Hello {{name}},</p>
    <p>You requested a password reset for your Story Connect account.  
    Click the button below to reset your password:</p>

    <a href="{{resetLink}}" class="button">Reset Password</a>

    <p>This link will expire in <strong>15 minutes</strong>.</p>
    <p>If you didn’t request this, you can safely ignore this email.</p>

    <div class="footer">
      Regards,<br>Story Connect
    </div>
  </div>
</body>
</html>
