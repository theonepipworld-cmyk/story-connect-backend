name: Deploy Mobile API
on:
  push:
    branches:
      - development
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_DEV_HOST }}
        username: ${{ secrets.EC2_DEV_USER }}
        key: ${{ secrets.EC2_DEV_SSH_KEY }}
        script: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          sudo chown -R $USER:$USER /var/www/html/story-connect-backend/.git
          cd /var/www/html/story-connect-backend
          sudo git fetch --all
          sudo git reset --hard origin/development
          sudo git pull origin development --force
          sudo npm install
          pm2 restart story-connect-backend || pm2 start server.js --name story-connect-backend