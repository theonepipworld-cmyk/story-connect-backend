name: Deploy Mobile API
on:
  push:
    branches:
      - development
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_DEV_HOST }}
        username: ${{ secrets.EC2_DEV_USER }}
        key: ${{ secrets.EC2_DEV_SSH_KEY }}
        script: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          sudo chown -R $USER:$USER /var/www/html/story-connect-backend
          git config --global --add safe.directory /var/www/html/story-connect-backend
          cd /var/www/html/story-connect-backend
          git fetch --all
          git reset --hard origin/development
          git pull origin development --force
          echo '${{ secrets.DEV_FIREBASE_SERVICE_ACCOUNT_JSON }}' > story-connect-c35dc-firebase-adminsdk-fbsvc-f40a5a7783.json
          npm install
          pm2 restart story-connect-backend || pm2 start server.js --name story-connect-backend