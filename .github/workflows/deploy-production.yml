name: Deploy Mobile API
on:
  push:
    branches:
      - production
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_PROD_HOST }}
        username: ${{ secrets.EC2_PROD_USER }}
        key: ${{ secrets.EC2_PROD_SSH_KEY }}
        script: |
          cd /var/www/html/story-connect-backend
          sudo git fetch --all
          sudo git reset --hard origin/PRODelopment
          sudo git pull origin PRODelopment --force
          sudo npm install
          pm2 restart server