name: Deploy Mobile API
on:
  push:
    branches:
      - production
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_PROD_HOST }}
        username: ${{ secrets.EC2_PROD_USER }}
        key: ${{ secrets.EC2_PROD_SSH_KEY }} 
        script: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          sudo chown -R $USER:$USER /var/www/html/story-connect-backend/.git
          cd /var/www/html/story-connect-backend
          git fetch --all
          git reset --hard origin/production
          git pull origin production --force
          npm install
          pm2 restart story-connect-backend || pm2 start server.js --name story-connect-backend